name: Update prices

on:
  schedule:
    # ASX trading hours are roughly 00:00–06:00 UTC on weekdays
    - cron: "15 0,2,4,6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices and FX
        run: python3 scripts/fetch_prices.py

      - name: Commit if changed
        run: |
          git config user.name "prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json || true
          git add history.json || true
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices"
            git push
          fi
