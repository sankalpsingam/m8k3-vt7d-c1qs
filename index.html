<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Analysis Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --card: #ffffff;
    --hero-grad-1: #ffffff;
    --hero-grad-2: #fbfbfd;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --border: #e8e8ed;
    --border-soft: #f2f2f4;
    --accent: #0071e3;
    --accent-soft: #e8f2ff;
    --pos: #1a9d4b;
    --pos-soft: #e6f7ec;
    --neg: #d70015;
    --neg-soft: #ffe9e6;
    --warn-soft: #fff2e0;
    --warn-text: #b26a00;
    --chip-bg: #f5f5f7;
    --ring-track: #f2f2f4;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
    --shadow-2: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --footnote: #b1b1b6;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --hero-grad-1: #1c1c1e;
    --hero-grad-2: #17171a;
    --text: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #86868b;
    --border: #2c2c2e;
    --border-soft: #2c2c2e;
    --accent: #2997ff;
    --accent-soft: #0f2438;
    --pos: #32d74b;
    --pos-soft: #0f2b18;
    --neg: #ff453a;
    --neg-soft: #331013;
    --warn-soft: #3a2a0f;
    --warn-text: #f0b429;
    --chip-bg: #2c2c2e;
    --ring-track: #2c2c2e;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    --shadow-2: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
    --footnote: #48484a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 32px 40px 64px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .top-left { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .top .sub { font-size: 13px; color: var(--text-tertiary); }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .refresh-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 100px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--accent);
    cursor: pointer; box-shadow: var(--shadow-2);
  }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .refresh-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .refresh-btn.danger { color: var(--neg); }

  .theme-toggle {
    display: flex; align-items: center; gap: 8px; background: var(--card);
    border-radius: 100px; padding: 4px; box-shadow: var(--shadow-2);
    user-select: none; border: 1px solid var(--border);
  }
  .theme-toggle .opt {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 26px; border-radius: 100px;
    font-size: 13px; color: var(--text-tertiary);
    background: none; border: none; padding: 0; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .theme-toggle .opt.active { background: var(--accent); color: #fff; }

  .banner { border-radius: 12px; padding: 10px 16px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .banner.warn { background: var(--warn-soft); color: var(--warn-text); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }

  .hero {
    background: linear-gradient(180deg, var(--hero-grad-1) 0%, var(--hero-grad-2) 100%);
    border-radius: 22px; padding: 36px 40px; box-shadow: var(--shadow-1);
    display: flex; align-items: center; justify-content: space-between;
    gap: 32px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .hero-left .label { font-size: 13px; color: var(--text-tertiary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .hero-left .value { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; }
  .hero-left .delta { margin-top: 8px; font-size: 14px; color: var(--text-secondary); }

  .ring-wrap { display: flex; align-items: center; gap: 24px; }
  .ring { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); width: 128px; height: 128px; }
  .ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .ring-center .pct { font-size: 20px; font-weight: 700; }
  .ring-center .lbl { font-size: 10px; color: var(--text-tertiary); }
  .legend { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  @media (max-width: 900px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
  .grid-fire { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-fire { grid-template-columns: 1fr; } }

  .stat-card { background: var(--card); border-radius: 18px; padding: 20px 22px; box-shadow: var(--shadow-2); }
  .stat-card .label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .section { margin-bottom: 32px; }
  .section-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 14px 2px; }
  .section-note { font-size: 11px; color: var(--footnote); margin: 12px 2px 0; }

  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow-2); overflow: hidden; }
  .owner-header { padding: 16px 22px 10px; font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }

  .table-scroll { overflow-x: auto; }
  .table-scroll table { min-width: 640px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.03em; padding: 10px 22px; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 12px 22px; font-size: 14px; border-bottom: 1px solid var(--border-soft); }
  tbody tr:last-child td { border-bottom: none; }
  tr.subtotal td { font-weight: 600; border-top: 1px solid var(--border); border-bottom: none; background: var(--chip-bg); font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ticker { font-weight: 600; }
  .gain-pos { color: var(--pos); font-weight: 600; }
  .gain-neg { color: var(--neg); font-weight: 600; }

  .re-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .re-grid { grid-template-columns: 1fr; } }
  .re-card { background: var(--card); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow-2); }
  .re-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .re-card .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; margin-bottom: 14px; }
  .tag.ppor { background: var(--accent-soft); color: var(--accent); }
  .tag.inv { background: var(--warn-soft); color: var(--warn-text); }
  .re-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; color: var(--text-secondary); border-top: 1px solid var(--border-soft); }
  .re-row:first-of-type { border-top: none; padding-top: 0; }
  .re-row .v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .re-range { font-size: 11px; color: var(--text-tertiary); margin: 4px 0 12px; }
  .re-equity { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
  .re-equity .lbl { font-size: 12px; color: var(--text-tertiary); }
  .re-equity .val { font-size: 19px; font-weight: 700; }
  .re-source { font-size: 10px; color: var(--text-tertiary); margin-top: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 22px 24px 8px; }
  .chip { background: var(--chip-bg); border-radius: 12px; padding: 10px 16px; min-width: 150px; }
  .chip .k { font-size: 11px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 3px; }
  .chip .v { font-size: 14px; font-weight: 600; }
  .goal-block { padding: 6px 24px 22px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .goal-block b { color: var(--text); }

  .advice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 900px) { .advice-grid { grid-template-columns: 1fr; } }
  .advice-card { background: var(--card); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow-2); }
  .advice-card .icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 12px; }
  .advice-card .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .advice-card .body { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
  .sev-high .icon { background: var(--neg-soft); }
  .sev-med .icon { background: var(--warn-soft); }
  .sev-good .icon { background: var(--pos-soft); }
  .sev-info .icon { background: var(--accent-soft); }

  .goal-card { background: var(--card); border-radius: 18px; padding: 24px 26px; box-shadow: var(--shadow-2); }
  .goal-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .goal-card .row .t { font-size: 15px; font-weight: 600; }
  .goal-card .row .p { font-size: 22px; font-weight: 700; color: var(--accent); }
  .progress-track { height: 10px; border-radius: 100px; background: var(--ring-track); overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--accent), #64b5ff); transition: width 0.4s ease; }
  .goal-meta { display: flex; flex-wrap: wrap; gap: 18px; font-size: 12px; color: var(--text-secondary); }
  .goal-meta b { color: var(--text); font-weight: 600; }

  .risk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 900px) { .risk-grid { grid-template-columns: 1fr; } }
  .risk-card { background: var(--card); border-radius: 18px; padding: 20px 22px; box-shadow: var(--shadow-2); }
  .risk-card .label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
  .risk-card .value { font-size: 24px; font-weight: 700; }
  .risk-card .badge { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; }
  .risk-card .sub { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; }
  .badge.risk-hi { background: var(--neg-soft); color: var(--neg); }
  .badge.risk-mid { background: var(--warn-soft); color: var(--warn-text); }
  .badge.risk-lo { background: var(--pos-soft); color: var(--pos); }

  .chart-card { background: var(--card); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow-2); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .chart-head .label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
  .chart-actions { display: flex; gap: 12px; }
  .mini-btn { background: none; border: none; color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; }
  .chip-btn {
    background: var(--chip-bg); border: none; border-radius: 100px;
    padding: 4px 10px; font-size: 11px; font-weight: 600;
    color: var(--text-secondary); cursor: pointer;
  }
  .chip-btn.active { background: var(--accent); color: #fff; }
  .chart-actions { flex-wrap: wrap; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-empty { text-align: center; color: var(--text-tertiary); font-size: 12px; padding: 70px 0; }

  /* Lock / onboarding screens */
  .gate-card { padding: 32px 34px; max-width: 560px; margin: 48px auto; }
  .gate-card h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: -0.01em; }
  .gate-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .gate-card .big-emoji { font-size: 40px; margin-bottom: 12px; }
  .gate-card input[type="password"], .gate-card input[type="text"], .gate-card input[type="url"] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; margin: 6px 0 12px;
  }
  .gate-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .gate-note { background: var(--warn-soft); color: var(--warn-text); border-radius: 10px; padding: 9px 14px; font-size: 12px; margin-bottom: 12px; }
  .gate-hint { font-size: 11px !important; color: var(--text-tertiary) !important; margin-top: 16px; }
  .gate-card label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  .gate-card code { background: var(--chip-bg); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  .gate-card ol { font-size: 13px; color: var(--text-secondary); line-height: 1.7; padding-left: 20px; }
  .gate-card a { color: var(--accent); }

  /* Editor */
  .ed-section { background: var(--card); border-radius: 18px; box-shadow: var(--shadow-2); padding: 22px 24px; margin-bottom: 20px; }
  .ed-section h3 { margin: 0 0 4px; font-size: 16px; letter-spacing: -0.01em; }
  .ed-section .ed-sub { font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; }
  .ed-rows { display: flex; flex-direction: column; gap: 10px; }
  .ed-row {
    display: grid; gap: 8px; align-items: center;
    background: var(--chip-bg); border-radius: 12px; padding: 10px 12px;
  }
  .ed-row.h-grid { grid-template-columns: 1.1fr 0.9fr 0.9fr 1.1fr 1.1fr 1.3fr 68px; }
  .ed-row .row-btns { display: flex; gap: 2px; justify-content: flex-end; }
  .ed-buy { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px; }
  .ed-buyform { background: var(--accent-soft); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .ed-buyform .ed-field label { color: var(--accent); }
  @media (max-width: 900px) { .ed-buyform { grid-template-columns: 1fr; } }
  .ed-row.p-grid { grid-template-columns: 1.6fr 0.7fr 1fr 1fr 1fr 34px; }
  .ed-row.head { background: none; padding: 0 12px; }
  .ed-row.head span { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; }
  @media (max-width: 900px) {
    .ed-row.h-grid, .ed-row.p-grid { grid-template-columns: 1fr 1fr; }
    .ed-row.head { display: none; }
    .ed-row input, .ed-row select { min-width: 0; }
  }
  .ed-row input, .ed-row select, .ed-field input, .ed-field select {
    width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px;
  }
  .ed-del { background: none; border: none; color: var(--neg); font-size: 15px; cursor: pointer; padding: 4px; }
  .ed-add { margin-top: 12px; }
  .ed-fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 900px) { .ed-fields { grid-template-columns: 1fr; } }
  .ed-field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 4px; }
  .save-bar {
    position: sticky; bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 16px; box-shadow: var(--shadow-1); margin-top: 8px;
  }
  .save-bar .status { font-size: 12px; color: var(--text-secondary); flex: 1; min-width: 160px; }
  .save-bar .nw { font-size: 13px; font-weight: 700; }
  .ed-warn { color: var(--warn-text); font-size: 12px; margin-top: 8px; }

  .footnote { text-align: center; font-size: 11px; color: var(--footnote); margin-top: 24px; line-height: 1.6; }
  .loading { text-align: center; padding: 80px 0; color: var(--text-tertiary); font-size: 14px; }
  .errbox { background: var(--card); border-radius: 18px; padding: 24px; color: var(--neg); font-size: 13px; line-height: 1.6; }
  .errbox b { color: var(--text); }

  @media (max-width: 640px) {
    body { padding: 20px 14px 48px; }
    .top h1 { font-size: 22px; }
    .hero { padding: 26px 22px; gap: 24px; }
    .hero-left .value { font-size: 34px; }
    .grid4 { grid-template-columns: 1fr 1fr; gap: 12px; }
    thead th, tbody td { padding-left: 14px; padding-right: 14px; }
    .gate-card { margin: 16px auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-left">
      <h1>Portfolio Analysis Dashboard</h1>
      <div class="sub" id="updatedAt">Loading…</div>
    </div>
    <div class="top-right">
      <button class="refresh-btn" id="refreshBtn">⟳ Refresh</button>
      <button class="refresh-btn" id="editBtn" style="display:none">✎ Edit</button>
      <button class="refresh-btn" id="lockBtn" style="display:none" aria-label="Lock dashboard" title="Lock dashboard">🔒 Lock</button>
      <div class="theme-toggle" id="themeToggle" role="group" aria-label="Colour theme">
        <button class="opt" data-mode="light" aria-label="Light mode">☀️</button>
        <button class="opt" data-mode="dark" aria-label="Dark mode">🌙</button>
      </div>
    </div>
  </div>
  <div id="app"><div class="loading">Loading…</div></div>
</div>

<script>
(function(){
  const saved = localStorage.getItem("pad-theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
})();
</script>

<script>
"use strict";

/* =====================================================================
   Self-contained architecture — no Google Sheets.
   - data.enc.json (in this repo) holds ALL financial data, encrypted in
     the browser with AES-256-GCM; the passphrase never leaves the page.
   - prices.json + AUD/INR are refreshed by .github/workflows/prices.yml.
   - Edits happen in the built-in editor and are committed back to the
     repo via the GitHub API using a fine-grained token you provide once
     per device. Every save is a commit = full history + rollback.
   ===================================================================== */

const DATA_FILE = "data.enc.json";
const TICKERS_FILE = "tickers.json";
const PRICES_FILE = "prices.json";
const HISTORY_FILE = "history.json";
const KDF_ITER = 310000;
const LS = {
  theme: "pad-theme",
  keyLocal: "pad-key",         // remembered unlock key (optional)
  encCache: "pad-enc-cache",   // last known envelope (covers Pages deploy lag)
  token: "pad-token",          // GitHub fine-grained token
  repo: "pad-repo",            // {owner, repo}
  chart: "pad-chart",          // chart mode/range preference
  // legacy keys from earlier architectures, removed on boot:
  legacy: ["pad-config", "pad-cache", "pad-history", "pad-history-enc"]
};

let DATA = null;       // decrypted data object
let PRICES = null;     // {updated, fx:{AUDINR}, prices:{TICKER:n}}
let PRICEHIST = null;  // {updated, series:{TICKER:[[date,close],...]}}
let CRYPTO = null;     // {key: CryptoKey, saltB64, iter}
let WORKING = null;    // editor working copy
let EDITOR_UI = { buyIdx: null }; // which holding has the buy form open
let CHART_UI = lsGetJsonStatic("pad-chart") || { mode: "stacked", range: "1Y" };
function lsGetJsonStatic(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e) { return null; } }

/* ================= Small utilities ================= */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function num(v){ const n = parseFloat(String(v == null ? "" : v).replace(/[$,%₹\s]/g, "").replace(/,/g, "")); return isFinite(n) ? n : 0; }
function fmtCurrency(n){
  const neg = n < 0;
  const v = Math.abs(Math.round(n)).toLocaleString("en-AU");
  return (neg ? "-$" : "$") + v;
}
function fmtSigned(n){ return (n >= 0 ? "+" : "") + fmtCurrency(n); }
function fmtPrice(n){ return n > 0 ? "$" + n.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—"; }
function fmtPct(n, digits){ return (isFinite(n) ? n : 0).toFixed(digits == null ? 1 : digits) + "%"; }
function fmtInrCr(inr){ return "₹" + (inr / 1e7).toFixed(2) + " Cr"; }
function localDateStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function lsGetJson(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e) { return null; } }
function lsSetJson(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function b64(bytes){ let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); }
function ub64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
function b64utf8(str){ return b64(new TextEncoder().encode(str)); }

/* ================= Crypto (WebCrypto, AES-256-GCM) ================= */
async function deriveKey(pass, saltBytes, iter){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBytes, iterations: iter || KDF_ITER, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}
async function encryptWithKey(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}
async function decryptWithKey(key, blob){
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(blob.iv) }, key, ub64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function makeEnvelope(obj){
  const enc = await encryptWithKey(CRYPTO.key, obj);
  return { v: 1, kdf: "pbkdf2-sha256", iter: CRYPTO.iter, salt: CRYPTO.saltB64, iv: enc.iv, ct: enc.ct, savedAt: Date.now() };
}
async function setPassphrase(pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt, KDF_ITER);
  CRYPTO = { key, saltB64: b64(salt), iter: KDF_ITER };
}
async function rememberKey(persistent){
  const raw = new Uint8Array(await crypto.subtle.exportKey("raw", CRYPTO.key));
  const rec = JSON.stringify({ k: b64(raw), salt: CRYPTO.saltB64, iter: CRYPTO.iter });
  sessionStorage.setItem(LS.keyLocal, rec);
  if (persistent) localStorage.setItem(LS.keyLocal, rec);
}
async function restoreKey(env){
  const rec = JSON.parse(sessionStorage.getItem(LS.keyLocal) || localStorage.getItem(LS.keyLocal) || "null");
  if (!rec || rec.salt !== env.salt) return false; // salt mismatch = passphrase changed elsewhere
  try {
    const key = await crypto.subtle.importKey("raw", ub64(rec.k), "AES-GCM", true, ["encrypt", "decrypt"]);
    DATA = await decryptWithKey(key, env);
    CRYPTO = { key, saltB64: rec.salt, iter: rec.iter || env.iter };
    return true;
  } catch(e) { return false; }
}

/* ================= GitHub API ================= */
function repoConfig(){
  let cfg = lsGetJson(LS.repo);
  if (cfg && cfg.owner && cfg.repo) return cfg;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const seg = location.pathname.split("/").filter(Boolean)[0];
  if (m && seg){ cfg = { owner: m[1], repo: seg }; lsSetJson(LS.repo, cfg); return cfg; }
  return null;
}
function getToken(){ return localStorage.getItem(LS.token) || ""; }
async function ghApi(path, opts){
  const token = getToken();
  if (!token) throw new Error("NO_TOKEN");
  const cfg = repoConfig();
  if (!cfg) throw new Error("NO_REPO");
  const res = await fetch("https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + path, Object.assign({
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    }
  }, opts || {}));
  return res;
}
async function ghPutFile(path, contentStr, message){
  let sha;
  const g = await ghApi("/contents/" + path + "?ref=main");
  if (g.status === 401 || g.status === 403) throw new Error("TOKEN_REJECTED");
  if (g.ok) sha = (await g.json()).sha;
  const body = { message, content: b64utf8(contentStr), branch: "main" };
  if (sha) body.sha = sha;
  const put = await ghApi("/contents/" + path, {
    method: "PUT",
    body: JSON.stringify(body)
  });
  if (!put.ok){
    const t = await put.text();
    throw new Error("Commit failed (" + put.status + "): " + t.slice(0, 180));
  }
}
async function ghDispatchPrices(){
  try { await ghApi("/actions/workflows/prices.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: "main" }) }); }
  catch(e) { /* token may lack Actions permission — prices update on schedule instead */ }
}

  // prefer whichever copy is newer
  if (fetched && cached) return (cached.savedAt || 0) > (fetched.savedAt || 0) ? cached : fetched;
  return fetched || cached;

function renderUnlock(env, notice){
  document.getElementById("updatedAt").textContent = "Locked";
  document.getElementById("app").innerHTML = `
  <div class="card gate-card">
    <div class="big-emoji">🔐</div>
    <h2>Unlock your dashboard</h2>
    ${notice ? `<div class="gate-note">${esc(notice)}</div>` : ""}
    <p>All data is encrypted. Enter your passphrase to decrypt it in this browser — it is never sent anywhere.</p>
    <input type="password" id="passInput" placeholder="Passphrase" autocomplete="current-password" autofocus>
    <label class="check"><input type="checkbox" id="rememberChk"> Keep me unlocked on this device</label>
    <div class="gate-actions">
      <button class="refresh-btn primary" id="unlockBtn">Unlock</button>
    </div>
    <p class="gate-hint">Forgot the passphrase? There is no reset — restore from an exported backup, or delete <code>data.enc.json</code> from the repository and set up again.</p>
  </div>`;
  const doUnlock = async () => {
    const btn = document.getElementById("unlockBtn");
    btn.disabled = true; btn.textContent = "Unlocking…";
    try {
      const pass = document.getElementById("passInput").value;
      const key = await deriveKey(pass, ub64(env.salt), env.iter || KDF_ITER);
      DATA = await decryptWithKey(key, env);
      CRYPTO = { key, saltB64: env.salt, iter: env.iter || KDF_ITER };
      await rememberKey(document.getElementById("rememberChk").checked);
      await afterUnlock();
    } catch(e) {
      btn.disabled = false; btn.textContent = "Unlock";
      renderUnlock(env, "That passphrase didn't work — please try again.");
    }
  };
  document.getElementById("unlockBtn").addEventListener("click", doUnlock);
  document.getElementById("passInput").addEventListener("keydown", e => { if (e.key === "Enter") doUnlock(); });

/* ================= Compute model ================= */
const SECTOR_MAP = {
  BHP: "Resources & Energy", RIO: "Resources & Energy", FMG: "Resources & Energy",
  WDS: "Resources & Energy", S32: "Resources & Energy", MIN: "Resources & Energy", STO: "Resources & Energy",
  CSL: "Healthcare", COH: "Healthcare", RMD: "Healthcare", SHL: "Healthcare",
  CBA: "Financials", NAB: "Financials", WBC: "Financials", ANZ: "Financials", MQG: "Financials",
  WES: "Consumer", WOW: "Consumer", COL: "Consumer",
  IVV: "Diversified ETFs", VGS: "Diversified ETFs", NDQ: "Diversified ETFs", BGBL: "Diversified ETFs",
  VAE: "Diversified ETFs", VAS: "Diversified ETFs", A200: "Diversified ETFs", IOZ: "Diversified ETFs",
  VTS: "Diversified ETFs", VEU: "Diversified ETFs", VDHG: "Diversified ETFs", DHHF: "Diversified ETFs",
  NDIA: "Diversified ETFs", GOLD: "Commodities"
};
const SECTOR_COLORS = {
  "Resources & Energy": "#d70015", "Healthcare": "#8e44ec", "Financials": "#b26a00",
  "Consumer": "#0d9488", "Diversified ETFs": "#0071e3", "Commodities": "#c9a227", "Other": "#86868b"
};
const SECTOR_NAMES = Object.keys(SECTOR_COLORS).filter(s => s !== "Other");
const PROPERTY_COLORS = ["#1a9d4b", "#2fbf71", "#7bd4a3"];
const DIVERSIFIED = "Diversified ETFs";

function computeModel(data, prices){
  const px = (prices && prices.prices) || {};
  const fx = num(prices && prices.fx && prices.fx.AUDINR);
  const owners = [];
  const holdingsByOwner = {};
  const missingPrices = [];
  const holdingsTotal = { mv: 0, cb: 0 };

  (data.holdings || []).forEach(h => {
    const live = num(px[h.ticker]);
    const manual = num(h.manualPrice);
    const price = live > 0 ? live : manual;
    const mv = price * num(h.shares);
    const cb = num(h.costBasis);
    const item = {
      owner: h.owner, ticker: h.ticker, sharesNum: num(h.shares), price, mv, cb,
      gainPct: cb ? ((mv - cb) / cb) * 100 : 0,
      sector: h.sector || SECTOR_MAP[h.ticker] || "Other",
      priceSource: live > 0 ? "live" : (manual > 0 ? "manual" : "none")
    };
    if (item.priceSource === "none" && !missingPrices.includes(h.ticker)) missingPrices.push(h.ticker);
    if (!holdingsByOwner[h.owner]){ holdingsByOwner[h.owner] = []; owners.push(h.owner); }
    holdingsByOwner[h.owner].push(item);
    holdingsTotal.mv += mv; holdingsTotal.cb += cb;
  });

  const re = { value: 0, loan: 0, offset: 0, equity: 0 };
  const properties = (data.properties || []).map(p => {
    const value = num(p.value), loan = num(p.loan), offset = num(p.offset);
    const netDebt = Math.max(loan - offset, 0);
    const equity = value - loan + offset;
    re.value += value; re.loan += loan; re.offset += offset; re.equity += equity;
    return { name: p.name, ppor: !!p.ppor, value, low: num(p.low), high: num(p.high),
             loan, offset, netDebt, equity, updated: p.updated || "", source: p.source || "" };
  });

  const netWorth = holdingsTotal.mv + re.equity;
  const fire = data.fire || {};
  const swr = num(fire.swrPct) / 100;
  const corpusInr = swr > 0 ? (num(fire.monthlyIncomeINR) * 12) / swr + num(fire.homeCostINR) : 0;
  const corpusAud = fx > 0 && corpusInr > 0 ? corpusInr / fx : 0;
  const progressPct = corpusAud > 0 ? (netWorth / corpusAud) * 100 : 0;

  return {
    owners, holdingsByOwner, holdingsTotal, properties, re, netWorth,
    profile: data.profile || {}, fire, fx, missingPrices,
    fireCorpusAud: corpusAud, fireProgressPct: progressPct,
    pricesUpdated: prices && prices.updated ? new Date(prices.updated) : null
  };
}

/* ================= FIRE projection ================= */
function projectYearsToFire(netWorth, fire, annualSavings, fx){
  const swr = num(fire.swrPct) / 100;
  const inflation = num(fire.inflationPct) / 100;
  const growthRate = num(fire.growthPct) / 100;
  const annualIncomeToday = num(fire.monthlyIncomeINR) * 12;
  const homeCostToday = num(fire.homeCostINR);
  if (!fx || !swr || (annualIncomeToday === 0 && homeCostToday === 0)) return null;
  const corpusTodayAud = ((annualIncomeToday / swr) + homeCostToday) / fx;
  if (netWorth >= corpusTodayAud) return { years: 0, futureCorpusAUD: corpusTodayAud };
  let balance = netWorth;
  for (let year = 1; year <= 60; year++){
    balance = balance * (1 + growthRate) + annualSavings;
    const targetInr = (annualIncomeToday * Math.pow(1 + inflation, year) / swr) + homeCostToday * Math.pow(1 + inflation, year);
    const targetAud = targetInr / fx; // FX held constant as a simplifying assumption
    if (balance >= targetAud) return { years: year, futureCorpusAUD: targetAud };
  }
  return { years: "60+", futureCorpusAUD: null };
}

/* ================= Concentration analytics ================= */
function computeConcentrationRisk(allHoldings, totalMv){
  const byTicker = {};
  allHoldings.forEach(h => {
    if (!byTicker[h.ticker]) byTicker[h.ticker] = { ticker: h.ticker, mv: 0, cb: 0, shares: 0, owners: [], sector: h.sector };
    const t = byTicker[h.ticker];
    t.mv += h.mv; t.cb += h.cb; t.shares += h.sharesNum || 0;
    if (!t.owners.includes(h.owner)) t.owners.push(h.owner);
  });
  let topTicker = "—", topMv = 0, hhi = 0;
  const sectorMv = {};
  Object.values(byTicker).forEach(t => {
    if (t.mv > topMv){ topMv = t.mv; topTicker = t.ticker; }
    const w = totalMv ? t.mv / totalMv : 0;
    hhi += w * w * 10000;
    sectorMv[t.sector] = (sectorMv[t.sector] || 0) + t.mv;
  });
  const topPct = totalMv ? (topMv / totalMv) * 100 : 0;
  let topSector = "—", topSectorMv = 0;
  Object.entries(sectorMv).forEach(([name, mv]) => {
    if (name !== DIVERSIFIED && mv > topSectorMv){ topSectorMv = mv; topSector = name; }
  });
  const topSectorPct = totalMv ? (topSectorMv / totalMv) * 100 : 0;
  return {
    byTicker, sectorMv, totalMv, topTicker, topPct,
    topBadge: topPct > 25 ? "risk-hi" : topPct > 12 ? "risk-mid" : "risk-lo",
    topLabel: topPct > 25 ? "Very concentrated" : topPct > 12 ? "Elevated" : "Reasonable",
    hhi: Math.round(hhi),
    hhiBadge: hhi > 2500 ? "risk-hi" : hhi > 1500 ? "risk-mid" : "risk-lo",
    hhiLabel: hhi > 2500 ? "Highly concentrated" : hhi > 1500 ? "Moderately concentrated" : "Well diversified",
    topSector, topSectorPct,
    topSectorBadge: topSectorPct > 40 ? "risk-hi" : topSectorPct > 20 ? "risk-mid" : "risk-lo",
    topSectorLabel: topSectorPct > 40 ? "Single-sector bet" : topSectorPct > 20 ? "Overweight" : "Balanced"
  };
}
function computeLargestAsset(byTicker, properties, netWorth){
  if (!netWorth) return { name: "—", pct: 0, badge: "risk-lo", label: "—" };
  const candidates = [
    ...Object.values(byTicker).map(t => ({ name: t.ticker, value: t.mv })),
    ...properties.map(p => ({ name: p.name, value: p.equity }))
  ];
  if (!candidates.length) return { name: "—", pct: 0, badge: "risk-lo", label: "—" };
  const top = candidates.reduce((a, b) => (b.value > a.value ? b : a));
  const pct = (top.value / netWorth) * 100;
  return {
    name: top.name, pct,
    badge: pct > 40 ? "risk-hi" : pct > 25 ? "risk-mid" : "risk-lo",
    label: pct > 40 ? "Dominant asset" : pct > 25 ? "Concentrated" : "Balanced"
  };
}
function computeNetWorthBreakdown(sectorMv, properties, netWorth){
  if (!netWorth) return [];
  const rows = Object.entries(sectorMv).map(([name, mv]) => ({
    name, group: "Equities", pct: (mv / netWorth) * 100, color: SECTOR_COLORS[name] || SECTOR_COLORS.Other
  }));
  properties.forEach((p, i) => {
    rows.push({ name: p.name, group: "Real Estate", pct: (p.equity / netWorth) * 100, color: PROPERTY_COLORS[i % PROPERTY_COLORS.length] });
  });
  return rows.sort((a, b) => b.pct - a.pct);
}

/* ================= Rule-based signals ================= */
function buildRecommendations(m, risk){
  const recs = [];
  const T = m.holdingsTotal.mv;
  const tickers = Object.values(risk.byTicker);

  if (T > 0){
    tickers
      .filter(t => t.sector !== DIVERSIFIED && (t.mv / T) * 100 > 15)
      .sort((a, b) => b.mv - a.mv)
      .slice(0, 2)
      .forEach(t => {
        const pct = (t.mv / T) * 100;
        const sellAmount = t.mv - 0.15 * T;
        const sellShares = t.shares > 0 ? Math.round(sellAmount / (t.mv / t.shares)) : 0;
        const gainPct = t.cb ? ((t.mv - t.cb) / t.cb) * 100 : 0;
        const cgtNote = gainPct < 0
          ? `It's under water (${fmtPct(gainPct)}), so selling realises a capital loss you can offset against other gains.`
          : gainPct < 10
            ? `The unrealised gain is small (${fmtPct(gainPct)}), so the CGT cost of acting now is minimal.`
            : `It's sitting on a +${fmtPct(gainPct)} gain — spread sales across financial years and use the 12-month CGT discount where parcels qualify.`;
        recs.push({
          sev: "high", emoji: "🎯",
          title: `Trim ${esc(t.ticker)} — it's ${fmtPct(pct, 0)} of your entire share portfolio`,
          body: `${fmtCurrency(t.mv)} in a single company is well past a prudent single-stock cap. ${cgtNote} Selling roughly ${fmtCurrency(sellAmount)}${sellShares ? ` (≈${sellShares.toLocaleString("en-AU")} shares at current prices)` : ""} in 2–3 tranches brings it down to ~15% of the book, with proceeds into the diversified ETFs you already hold.`
        });
      });
  }

  if (T > 0 && risk.topSectorPct > 25){
    const sectorTickers = tickers.filter(t => t.sector === risk.topSector);
    const sectorMv = risk.sectorMv[risk.topSector] || 0;
    recs.push({
      sev: "high", emoji: "⚖️",
      title: `${esc(risk.topSector)} is ${fmtPct(risk.topSectorPct, 0)} of your shares — one macro driver, one outcome`,
      body: `${sectorTickers.map(t => esc(t.ticker)).join(", ")} total ${fmtCurrency(sectorMv)} and are driven by the same cycle, so this isn't ${sectorTickers.length} separate bets — it's one. Trimming ${fmtCurrency(Math.max(sectorMv - 0.20 * T, 0))} across the basket gets the sector to ~20% of the share portfolio. Set a standing rule: no single sector above 20% of equities, rebalanced every 6 months.`
    });
  }

  tickers
    .filter(t => t.cb > 0 && t.mv > 0 && ((t.mv - t.cb) / t.cb) * 100 < -30)
    .sort((a, b) => (a.mv - a.cb) / a.cb - (b.mv - b.cb) / b.cb)
    .slice(0, 2)
    .forEach(t => {
      const lossPct = ((t.mv - t.cb) / t.cb) * 100;
      recs.push({
        sev: "med", emoji: "🔍",
        title: `${esc(t.ticker)} shows a ${fmtPct(Math.abs(lossPct), 0)} loss — verify before acting`,
        body: `Cost ${fmtCurrency(t.cb)} vs current ${fmtCurrency(t.mv)}. First check your broker statement for a corporate action (capital return, demerger, consolidation) that may have distorted the recorded cost base. If the loss is genuine, it's a tax-loss harvesting candidate: realise it against this year's capital gains, then either stay out for 30+ days or switch to a sector ETF to keep the exposure without a wash-sale-style ATO challenge.`
      });
    });

  const dupes = tickers.filter(t => t.owners.length > 1);
  if (dupes.length){
    recs.push({
      sev: "info", emoji: "🗂️",
      title: `${dupes.map(t => esc(t.ticker)).join(", ")} held in both portfolios — consolidate the tracking`,
      body: `${dupes.map(t => `${esc(t.ticker)} (${fmtCurrency(t.mv)} across ${t.owners.map(esc).join(" + ")})`).join("; ")}. Not a diversification problem, but it doubles the admin — two DRPs and two tax statements per holding for the same exposure. Going forward, top up each ETF from whichever account already holds the larger position so CGT records stay in one place.`
    });
  }

  const monthly = num(m.profile.monthlySavings);
  const hasIndiaGoal = num(m.fire.monthlyIncomeINR) > 0 || num(m.fire.homeCostINR) > 0;
  if (monthly > 0){
    const toEquities = Math.round(monthly * 0.7 / 100) * 100;
    const toOther = monthly - toEquities;
    recs.push({
      sev: "info", emoji: "💵",
      title: `Put the ${fmtCurrency(monthly)}/month surplus on autopilot`,
      body: `Set up two standing transfers on payday: ${fmtCurrency(toEquities)}/month (70%) into your diversified ETFs${T > 0 && risk.topPct > 15 ? " until the oversized positions above are back under their caps" : ""}, and ${fmtCurrency(toOther)}/month (30%) ${hasIndiaGoal ? "earmarked for the relocation fund (next card)" : m.re.loan > 0 ? "into the offset against your highest-rate loan" : "into a cash buffer"}. Automating this removes the temptation to let surplus cash drift.`
    });
  }

  if (hasIndiaGoal && monthly > 0){
    const fxAmount = Math.round(monthly * 0.3 / 100) * 100;
    recs.push({
      sev: "info", emoji: "🌏",
      title: "Start building the India fund now, not at move time",
      body: `Your assets are AUD-denominated while the goal${m.fireCorpusAud ? ` (${fmtCurrency(m.fireCorpusAud)} target corpus)` : ""} is INR-denominated — converting one lump sum at relocation is a currency-timing bet you don't need to take. Direct the ${fmtCurrency(fxAmount)}/month earmarked above into an ASX-listed India ETF (e.g. NDIA) or recurring AUD→INR transfers into an NRE deposit/mutual fund. Review the rate${m.fx ? ` (currently ${m.fx.toFixed(2)})` : ""} quarterly and accelerate when it's favourable.`
    });
  }

  if (!recs.some(r => r.sev === "high" || r.sev === "med") && T > 0){
    recs.unshift({
      sev: "good", emoji: "✅",
      title: "No concentration flags right now",
      body: `Largest single position ${esc(risk.topTicker)} at ${fmtPct(risk.topPct, 0)} of equities and top sector ${esc(risk.topSector)} at ${fmtPct(risk.topSectorPct, 0)} are both inside the 15% / 25% lines. Keep rebalancing against those thresholds every 6 months.`
    });
  }
  const order = { high: 0, med: 1, info: 2, good: 3 };
  return recs.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ================= Dashboard render ================= */
async function renderDashboard(){
  const m = computeModel(DATA, PRICES);
  const eqPct = m.netWorth ? (m.holdingsTotal.mv / m.netWorth) * 100 : 0;

/* ================= Wealth history =================
   Reconstructed, not stored: equities value through time comes from real
   daily closes (history.json) × the holdings you had at that date. Every
   editor save records a snapshot {date, re, shares} inside the encrypted
   data file, so holdings changes and property revaluations step in at the
   right dates. Dates before the first snapshot assume the oldest known mix. */
function appendSnapshot(W){
  const m = computeModel(W, PRICES);
  const shares = {};
  (W.holdings || []).forEach(h => { shares[h.ticker] = (shares[h.ticker] || 0) + num(h.shares); });
  const snap = { date: localDateStr(), re: Math.round(m.re.equity), shares };
  W.history = (W.history || []).filter(s => s.date !== snap.date);
  W.history.push(snap);
  W.history.sort((a, b) => a.date.localeCompare(b.date));
  if (W.history.length > 400) W.history = W.history.slice(-400);
}
function buildWealthSeries(m){
  const seriesSrc = (PRICEHIST && PRICEHIST.series) || {};
  const snaps = (DATA.history || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const today = localDateStr();

  const dateSet = new Set();
  Object.values(seriesSrc).forEach(arr => arr.forEach(p => dateSet.add(p[0])));
  const dates = Array.from(dateSet).filter(d => d <= today).sort();
  if (!dates.length || dates[dates.length - 1] !== today) dates.push(today);

  const currentShares = {};
  (DATA.holdings || []).forEach(h => { currentShares[h.ticker] = (currentShares[h.ticker] || 0) + num(h.shares); });
  const oldestShares = snaps.length ? snaps[0].shares : currentShares;
  const oldestRe = snaps.length ? snaps[0].re : m.re.equity;

  const ptr = {}, lastClose = {}, firstClose = {};
  Object.entries(seriesSrc).forEach(([t, arr]) => { ptr[t] = 0; firstClose[t] = arr.length ? arr[0][1] : null; });

  let snapPtr = -1;
  const rows = [];
  for (const d of dates){
    while (snapPtr + 1 < snaps.length && snaps[snapPtr + 1].date <= d) snapPtr++;
    const shares = snapPtr >= 0 ? snaps[snapPtr].shares : oldestShares;
    const re = snapPtr >= 0 ? snaps[snapPtr].re : oldestRe;
    Object.entries(seriesSrc).forEach(([t, arr]) => {
      while (ptr[t] < arr.length && arr[ptr[t]][0] <= d){ lastClose[t] = arr[ptr[t]][1]; ptr[t]++; }
    });
    let eq = 0;
    for (const [t, n] of Object.entries(shares)){
      const c = lastClose[t] != null ? lastClose[t] : firstClose[t];
      if (c != null) eq += n * c;
      else if (d === today){
        const live = num(PRICES && PRICES.prices && PRICES.prices[t]);
        if (live > 0) eq += n * live;
      }
    }
    if (d === today) eq = m.holdingsTotal.mv; // exact figure from the live model
    rows.push({ date: d, eq: Math.round(eq), re: Math.round(re), nw: Math.round(eq + re) });
  }
  return rows.filter(r => r.nw > 0);
}
function sliceByRange(rows, range){
  if (range === "ALL") return rows;
  const days = range === "3M" ? 92 : range === "6M" ? 183 : 366;
  const cutoff = new Date(Date.now() - days * 864e5);
  const cutoffStr = cutoff.getFullYear() + "-" + String(cutoff.getMonth() + 1).padStart(2, "0") + "-" + String(cutoff.getDate()).padStart(2, "0");
  return rows.filter(r => r.date >= cutoffStr);
}

let historyChartInstance = null;
let lastSeries = null;
function drawWealthChart(series){
  lastSeries = series;
  const canvas = document.getElementById("historyChart");
  if (!canvas || typeof Chart === "undefined") return;
  if (historyChartInstance){ historyChartInstance.destroy(); historyChartInstance = null; }
  const rows = sliceByRange(series, CHART_UI.range);
  if (!rows.length) return;
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue("--accent").trim() || "#0071e3";
  const pos = styles.getPropertyValue("--pos").trim() || "#1a9d4b";
  const gridColor = styles.getPropertyValue("--border-soft").trim() || "#f2f2f4";
  const textColor = styles.getPropertyValue("--text-tertiary").trim() || "#86868b";
  const labels = rows.map(r => r.date);
  const line = (label, key, color, fill) => ({
    label, data: rows.map(r => r[key]), borderColor: color,
    backgroundColor: color + "22", fill: !!fill, tension: 0.3, pointRadius: 0, borderWidth: 2.5
  });
  let datasets, stacked = false;
  if (CHART_UI.mode === "stacked"){
    stacked = true;
    datasets = [
      { label: "Property equity", data: rows.map(r => r.re), borderColor: pos, backgroundColor: pos + "33", fill: "origin", tension: 0.3, pointRadius: 0, borderWidth: 1.5 },
      { label: "Equities", data: rows.map(r => r.eq), borderColor: accent, backgroundColor: accent + "33", fill: "-1", tension: 0.3, pointRadius: 0, borderWidth: 1.5 }
    ];
  } else if (CHART_UI.mode === "nw") datasets = [line("Net worth", "nw", accent, true)];
  else if (CHART_UI.mode === "eq") datasets = [line("Equities", "eq", accent, true)];
  else datasets = [line("Property equity", "re", pos, true)];

  historyChartInstance = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: datasets.length > 1, labels: { color: textColor, boxWidth: 10, boxHeight: 2, font: { size: 10 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => ctx.dataset.label + ": " + fmtCurrency(stacked ? rows[ctx.dataIndex][ctx.datasetIndex === 0 ? "re" : "eq"] : ctx.parsed.y),
            footer: (items) => stacked && items.length ? "Net worth: " + fmtCurrency(rows[items[0].dataIndex].nw) : ""
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: textColor, font: { size: 10 }, maxTicksLimit: 6 } },
        y: { stacked, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, callback: (v) => "$" + (v / 1000).toFixed(0) + "k" } }
      }
    }
  });
}

function renderEditor(status){

function validateWorking(W){
  for (const h of W.holdings){
    if (!h.owner) return "Every holding needs an owner.";
    if (!/^[A-Z0-9]{1,6}(\.[A-Z]{1,3})?$/.test(h.ticker || "")) return `"${h.ticker || ""}" doesn't look like a ticker (use e.g. VGS).`;
    if (!(num(h.shares) > 0)) return `${h.ticker}: shares must be greater than 0.`;
  }
  for (const p of W.properties){
    if (!p.name) return "Every property needs a name.";
    if (!(num(p.value) > 0)) return `${p.name}: value must be greater than 0.`;
  }
  return null;
}
async function saveWorking(){
  const statusEl = document.getElementById("edStatus");
  const setStatus = (t) => { if (statusEl) statusEl.textContent = t; };

  // settings first, so a token pasted just now is used for this save
  const tokenVal = (document.getElementById("tokenInput").value || "").trim();
  if (tokenVal) localStorage.setItem(LS.token, tokenVal); else localStorage.removeItem(LS.token);
  const repoVal = (document.getElementById("repoInput").value || "").trim();
  if (/^[^/\s]+\/[^/\s]+$/.test(repoVal)){
    const [owner, repo] = repoVal.split("/");
    lsSetJson(LS.repo, { owner, repo });
  }

  const err = validateWorking(WORKING);
  if (err){ setStatus("⚠ " + err); return; }
  if (!getToken()){ setStatus("⚠ Add a GitHub token in Settings first — the save is a git commit."); return; }

  const newPass = document.getElementById("newPassInput").value;
  try {
    setStatus("Encrypting…");
    if (newPass){
      if (newPass.length < 8){ setStatus("⚠ New passphrase must be at least 8 characters."); return; }
      await setPassphrase(newPass);
      await rememberKey(!!localStorage.getItem(LS.keyLocal));
    }
    const oldTickers = JSON.stringify(tickersOf(DATA));
    appendSnapshot(WORKING); // record {date, property equity, share counts} for the wealth chart
    const env = await makeEnvelope(WORKING);
    setStatus("Committing to GitHub…");
    await ghPutFile(DATA_FILE, JSON.stringify(env), "Update portfolio data");
    const newTickers = tickersOf(WORKING);
    if (JSON.stringify(newTickers) !== oldTickers){
      await ghPutFile(TICKERS_FILE, JSON.stringify({ tickers: newTickers }, null, 2) + "\n", "Update ticker list");
      const px = (PRICES && PRICES.prices) || {};
      if (newTickers.some(t => !(num(px[t]) > 0))) await ghDispatchPrices();
    }
    lsSetJson(LS.encCache, env);
    DATA = WORKING; WORKING = null;
    await renderDashboard();
  } catch(e) {
    if (e.message === "NO_TOKEN") setStatus("⚠ Add a GitHub token in Settings first.");
    else if (e.message === "NO_REPO") setStatus("⚠ Set the repository (owner/name) in Settings.");
    else if (e.message === "TOKEN_REJECTED") setStatus("⚠ GitHub rejected the token — check it has Contents read/write on this repository.");
    else setStatus("⚠ " + e.message);
  }
}
function exportDataBackup(){
  const blob = new Blob([JSON.stringify(WORKING || DATA, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "portfolio-data-" + localDateStr() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

  if (step === "welcome"){

        <button class="refresh-btn" id="obFresh">Start fresh</button>

  if (step === "import"){
    app.innerHTML = `

      </div>

    document.getElementById("obBack").addEventListener("click", () => renderOnboarding("welcome"));
    document.getElementById("obFetch").addEventListener("click", async () => {
      const url = document.getElementById("obUrl").value;
      const csvUrl = sheetCsvUrl(url);
      if (!csvUrl){ renderOnboarding("import", { url, notice: "That doesn't look like a Google Sheets URL." }); return; }
      const btn = document.getElementById("obFetch");
      btn.disabled = true; btn.textContent = "Importing…";
      try {
        const res = await fetch(csvUrl, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        if (/^\s*<|accounts\.google\.com|Sign in/i.test(text)) throw new Error("The sheet isn't link-shared — turn on link sharing (Viewer) and retry.");
        const data = importSheet(text);
        if (!data.holdings.length && !data.properties.length) throw new Error("No holdings or properties were recognised in that sheet.");
        renderOnboarding("pass", { data, importedNote: `Imported ${data.holdings.length} holdings and ${data.properties.length} properties.` });
      } catch(e) {
        renderOnboarding("import", { url, notice: e.message });
      }
    });
    return;
  }

  if (step === "pass"){
    app.innerHTML = `
    <div class="card gate-card">
      <h2>Choose your passphrase</h2>
      ${state.importedNote ? `<div class="banner info">✓ ${esc(state.importedNote)}</div>` : ""}
      ${state.notice ? `<div class="gate-note">${esc(state.notice)}</div>` : ""}
      <p>This encrypts everything (AES-256). It is required to view the dashboard on any device, and it <b>cannot be reset</b> — only restored from a backup you export.</p>
      <input type="password" id="obPass1" placeholder="Passphrase (min 8 characters)" autocomplete="new-password">
      <input type="password" id="obPass2" placeholder="Repeat passphrase" autocomplete="new-password">
      <div class="gate-actions">
        <button class="refresh-btn primary" id="obPassNext">Continue</button>
      </div>
    </div>`;
    document.getElementById("obPassNext").addEventListener("click", async () => {
      const p1 = document.getElementById("obPass1").value;
      const p2 = document.getElementById("obPass2").value;
      if (p1.length < 8){ renderOnboarding("pass", Object.assign(state, { notice: "Use at least 8 characters." })); return; }
      if (p1 !== p2){ renderOnboarding("pass", Object.assign(state, { notice: "The passphrases don't match." })); return; }
      await setPassphrase(p1);
      renderOnboarding("token", state);
    });
    return;
  }

  if (step === "token"){
    const cfg = repoConfig();
    app.innerHTML = `
    <div class="card gate-card">
      <h2>Connect GitHub (to save)</h2>
      ${state.notice ? `<div class="gate-note">${esc(state.notice)}</div>` : ""}
      <p>Saving commits your encrypted data to <code>${cfg ? esc(cfg.owner + "/" + cfg.repo) : "your repository"}</code>. Create a token once:</p>
      <ol>
        <li>GitHub → Settings → Developer settings → <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained tokens → Generate new token</a></li>
        <li>Repository access: <b>Only select repositories</b> → this repo</li>
        <li>Permissions → Repository: <b>Contents — Read and write</b> (and optionally <b>Actions — Read and write</b> for instant price updates)</li>
        <li>Generate, copy, paste below</li>
      </ol>
      <input type="password" id="obToken" placeholder="github_pat_…">
      ${cfg ? "" : `<input type="text" id="obRepo" placeholder="Repository as owner/name">`}
      <div class="gate-actions">
        <button class="refresh-btn primary" id="obFinish">Save &amp; finish</button>
        <button class="refresh-btn" id="obSkip">Skip for now (this browser only)</button>
      </div>
      <p class="gate-hint">The token stays in this browser's storage and is sent only to api.github.com. "Skip" keeps everything locally until you add a token later in ✎ Edit → Settings.</p>
    </div>`;
    const finish = async (withToken) => {
      const btn = document.getElementById("obFinish");
      btn.disabled = true;
      try {
        if (withToken){
          const tok = (document.getElementById("obToken").value || "").trim();
          if (!tok){ renderOnboarding("token", Object.assign(state, { notice: "Paste the token, or use Skip." })); return; }
          localStorage.setItem(LS.token, tok);
          const repoEl = document.getElementById("obRepo");
          if (repoEl){
            const v = (repoEl.value || "").trim();
            if (!/^[^/\s]+\/[^/\s]+$/.test(v)){ renderOnboarding("token", Object.assign(state, { notice: "Enter the repository as owner/name." })); return; }
            const [owner, repo] = v.split("/");
            lsSetJson(LS.repo, { owner, repo });
          }
        }
        DATA = state.data;
        appendSnapshot(DATA);
        const env = await makeEnvelope(DATA);
        if (withToken){
          await ghPutFile(DATA_FILE, JSON.stringify(env), "Initialise encrypted portfolio data");
          await ghPutFile(TICKERS_FILE, JSON.stringify({ tickers: tickersOf(DATA) }, null, 2) + "\n", "Update ticker list");
          await ghDispatchPrices();
        }
        lsSetJson(LS.encCache, env);
        await rememberKey(false);
        await afterUnlock();
      } catch(e) {
        btn.disabled = false;
        const msg = e.message === "TOKEN_REJECTED"
          ? "GitHub rejected the token — check it has Contents read/write on this repository."
          : e.message;
        renderOnboarding("token", Object.assign(state, { notice: msg }));
      }
    };
    document.getElementById("obFinish").addEventListener("click", () => finish(true));
    document.getElementById("obSkip").addEventListener("click", () => finish(false));
    return;
  }
}

/* ================= One-time Google Sheet import =================
   Reuses the row-shape classifier from the previous architecture. */
function sheetCsvUrl(input){
  input = (input || "").trim();
  const m = input.match(/docs\.google\.com\/spreadsheets\/d\/([A-Za-z0-9_-]+)/);
  if (!m) return null;
  const gid = (input.match(/[#?&]gid=(\d+)/) || [])[1] || "0";
  return "https://docs.google.com/spreadsheets/d/" + m[1] + "/gviz/tq?tqx=out:csv&headers=0&gid=" + gid;
}
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.map(r => r.map(c => (c || "").replace(/\\/g, "").trim()));
}
function importSheet(csvText){
  const rows = parseCSV(csvText);
  const TICKER_RE = /^[A-Z0-9]{2,6}(\.[A-Z]{1,3})?$/;
  const H = { owner: 0, ticker: 1, shares: 3, price: 5, mv: 6, cb: 7 };
  const P = { name: 0, low: 3, value: 4, high: 5, loan: 6, offset: 7, updated: 10, source: 11 };
  const data = emptyData();
  const map = {};
  let lastOwner = "";
  const textOnly = (r) => !r.some(c => Math.abs(num(c)) > 999);

  rows.forEach(r => {
    const isHeader = textOnly(r) && (r.some(c => (c || "").toLowerCase() === "ticker") || r.some(c => (c || "").toLowerCase().includes("net equity")));
    if (isHeader) return;
    const tick = r[H.ticker] || "";
    const mv = num(r[H.mv]), sh = num(r[H.shares]);
    if (TICKER_RE.test(tick) && mv > 0 && sh > 0){
      const owner = r[H.owner] || lastOwner;
      if (!owner) return;
      lastOwner = owner;
      data.holdings.push({
        owner, ticker: tick, shares: sh, costBasis: num(r[H.cb]),
        sector: "", manualPrice: num(r[H.price]) || null // sheet price seeds the fallback until the feed covers it
      });
      return;
    }
    const name = r[P.name] || "";
    if (name && !/\b(total|subtotal|combined|sum)\b/i.test(name)){
      const val = num(r[P.value]);
      const lowV = num(r[P.low]), highV = num(r[P.high]);
      const loan = num(r[P.loan]), offset = num(r[P.offset]);
      if (val > 50000 && (lowV > 0 || highV > 0 || loan > 0 || offset > 0)){
        data.properties.push({
          name, ppor: /ppor|owner occ/i.test(name), value: val, low: lowV, high: highV,
          loan, offset, updated: r[P.updated] || "", source: r[P.source] || ""
        });
        return;
      }
    }
    if (r[0] && r[1]) map[r[0]] = r[1];
  });

  data.profile = {
    riskTolerance: map["Risk Tolerance"] || "",
    timeHorizon: map["Time Horizon"] || "",
    combinedIncome: map["Combined Annual Income"] || "",
    monthlySavings: num(map["Monthly Savings Rate"]),
    annualSavings: num(map["Annual Savings Rate"]),
    savingsRatePct: map["Savings Rate pct of income"] || "",
    goal1: map["Primary Goal 1"] || "",
    goal2: map["Primary Goal 2"] || ""
  };
  data.fire = {
    monthlyIncomeINR: num(map["Desired Monthly Passive Income Today (INR)"]),
    homeCostINR: num(map["Target India Home Cost Today (INR)"]),
    swrPct: num(map["Safe Withdrawal Rate"]) || 3.5,
    inflationPct: num(map["Assumed India Inflation Rate"]) || 6,
    growthPct: num(map["Assumed Annual Portfolio Growth Rate"]) || 7
  };
  return data;
}

/* ================= Theme & boot wiring ================= */
function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  localStorage.setItem(LS.theme, mode);
  document.querySelectorAll(".theme-toggle .opt").forEach(el => {
    el.classList.toggle("active", el.dataset.mode === mode);
  });
  if (historyChartInstance && lastSeries && document.getElementById("historyChart")) drawWealthChart(lastSeries);
}

document.addEventListener("DOMContentLoaded", () => {
  setTheme(localStorage.getItem(LS.theme) || "light");
  document.getElementById("themeToggle").addEventListener("click", (e) => {
    const opt = e.target.closest(".opt");
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    setTheme(opt ? opt.dataset.mode : (cur === "light" ? "dark" : "light"));
  });
  document.getElementById("refreshBtn").addEventListener("click", async () => {
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true; btn.textContent = "⟳ Refreshing…";
    PRICES = await fetchJsonFile(PRICES_FILE) || PRICES;
    PRICEHIST = await fetchJsonFile(HISTORY_FILE) || PRICEHIST;
    if (DATA && !WORKING) await renderDashboard();
    btn.disabled = false; btn.textContent = "⟳ Refresh";
  });
  document.getElementById("editBtn").addEventListener("click", () => { if (DATA){ EDITOR_UI.buyIdx = null; renderEditor(); } });
  document.getElementById("lockBtn").addEventListener("click", lockNow);

  // Delegated editor events
  document.getElementById("app").addEventListener("input", (e) => {
    const el = e.target;
    if (!el.matches("[data-bind]") || !WORKING) return;
    const sec = el.dataset.sec, field = el.dataset.field, idx = el.dataset.idx;
    let v = el.value;
    if (el.dataset.kind === "num") v = num(v);
    if (el.dataset.kind === "bool") v = el.checked;
    if (el.dataset.kind === "ticker"){ v = v.toUpperCase().trim(); el.value = v; }
    if (idx != null && idx !== "") WORKING[sec][+idx][field] = v;
    else WORKING[sec][field] = v;
    editorUpdatePreview();
  });
  document.getElementById("app").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === "add-holding"){ EDITOR_UI.buyIdx = null; WORKING.holdings.push({ owner: WORKING.holdings[0] ? WORKING.holdings[WORKING.holdings.length-1].owner : "", ticker: "", shares: 0, costBasis: 0, sector: "", manualPrice: null }); renderEditor(); }
    else if (act === "del-holding"){ EDITOR_UI.buyIdx = null; WORKING.holdings.splice(+btn.dataset.idx, 1); renderEditor(); }
    else if (act === "buy-open"){ EDITOR_UI.buyIdx = +btn.dataset.idx; renderEditor(); }
    else if (act === "buy-cancel"){ EDITOR_UI.buyIdx = null; renderEditor(); }
    else if (act === "buy-apply"){
      const h = WORKING.holdings[+btn.dataset.idx];
      const newTotal = num(document.getElementById("buyTotal").value);
      const paid = num(document.getElementById("buyPaid").value);
      const cur = num(h.shares);
      if (!(newTotal > 0) || newTotal === cur){ renderEditor("⚠ Enter the new total number of shares (different from the current total)."); return; }
      if (newTotal > cur){
        if (!(paid > 0)){ renderEditor("⚠ Enter what you paid for the extra " + (newTotal - cur).toLocaleString("en-AU") + " shares so the cost basis stays right."); return; }
        h.costBasis = num(h.costBasis) + paid;
      } else {
        h.costBasis = cur > 0 ? num(h.costBasis) * (newTotal / cur) : num(h.costBasis); // proportional for sells
      }
      h.shares = newTotal;
      EDITOR_UI.buyIdx = null;
      renderEditor((newTotal > cur ? "Purchase" : "Sale") + " recorded for " + h.ticker + " — remember to Save to GitHub.");
    }
    else if (act === "add-prop"){ WORKING.properties.push({ name: "", ppor: false, value: 0, low: 0, high: 0, loan: 0, offset: 0, updated: "", source: "" }); renderEditor(); }
    else if (act === "del-prop"){ WORKING.properties.splice(+btn.dataset.idx, 1); renderEditor(); }
    else if (act === "discard"){ WORKING = null; renderDashboard(); }
    else if (act === "save"){ saveWorking(); }
    else if (act === "export-data"){ exportDataBackup(); }
    else if (act === "import-data"){ document.getElementById("dataFile").click(); }
  });

  boot();
  // periodic price refresh while visible
  setInterval(async () => {
    if (document.hidden || !DATA || WORKING) return;
    const fresh = await fetchJsonFile(PRICES_FILE);
    if (fresh && (!PRICES || fresh.updated !== PRICES.updated)){
      PRICES = fresh;
      PRICEHIST = await fetchJsonFile(HISTORY_FILE) || PRICEHIST;
      await renderDashboard();
    }
  }, 5 * 60 * 1000);
});
</script>
