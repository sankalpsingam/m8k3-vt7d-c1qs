<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Analysis Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --card: #ffffff;
    --hero-grad-1: #ffffff;
    --hero-grad-2: #fbfbfd;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --border: #e8e8ed;
    --border-soft: #f2f2f4;
    --accent: #0071e3;
    --accent-soft: #e8f2ff;
    --pos: #1a9d4b;
    --pos-soft: #e6f7ec;
    --neg: #d70015;
    --neg-soft: #ffe9e6;
    --warn-soft: #fff2e0;
    --warn-text: #b26a00;
    --chip-bg: #f5f5f7;
    --ring-track: #f2f2f4;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
    --shadow-2: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --footnote: #b1b1b6;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --hero-grad-1: #1c1c1e;
    --hero-grad-2: #17171a;
    --text: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #86868b;
    --border: #2c2c2e;
    --border-soft: #2c2c2e;
    --accent: #2997ff;
    --accent-soft: #0f2438;
    --pos: #32d74b;
    --pos-soft: #0f2b18;
    --neg: #ff453a;
    --neg-soft: #331013;
    --warn-soft: #3a2a0f;
    --warn-text: #f0b429;
    --chip-bg: #2c2c2e;
    --ring-track: #2c2c2e;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    --shadow-2: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
    --footnote: #48484a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 32px 40px 64px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .top-left { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .top h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .top .sub {
    font-size: 13px;
    color: var(--text-tertiary);
  }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .refresh-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    box-shadow: var(--shadow-2);
  }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border-radius: 100px;
    padding: 4px;
    box-shadow: var(--shadow-2);
    user-select: none;
    border: 1px solid var(--border);
  }
  .theme-toggle .opt {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 26px; border-radius: 100px;
    font-size: 13px; color: var(--text-tertiary);
    background: none; border: none; padding: 0; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .theme-toggle .opt.active { background: var(--accent); color: #fff; }

  .stale-banner {
    background: var(--warn-soft);
    color: var(--warn-text);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .hero {
    background: linear-gradient(180deg, var(--hero-grad-1) 0%, var(--hero-grad-2) 100%);
    border-radius: 22px;
    padding: 36px 40px;
    box-shadow: var(--shadow-1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .hero-left .label {
    font-size: 13px;
    color: var(--text-tertiary);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .hero-left .value {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .hero-left .delta {
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .hero-left .delta.pos { color: var(--pos); }
  .hero-left .delta.neg { color: var(--neg); }

  .ring-wrap { display: flex; align-items: center; gap: 24px; }
  .ring { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); width: 128px; height: 128px; }
  .ring-center {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .ring-center .pct { font-size: 20px; font-weight: 700; }
  .ring-center .lbl { font-size: 10px; color: var(--text-tertiary); }
  .legend { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .grid4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  @media (max-width: 900px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }

  .grid-fire { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-fire { grid-template-columns: 1fr; } }

  .stat-card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: var(--shadow-2);
  }
  .stat-card .label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .section { margin-bottom: 32px; }
  .section-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 14px 2px;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }

  .owner-header {
    padding: 16px 22px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .table-scroll { overflow-x: auto; }
  .table-scroll table { min-width: 640px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 10px 22px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 12px 22px;
    font-size: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  tbody tr:last-child td { border-bottom: none; }
  tr.subtotal td { font-weight: 600; border-top: 1px solid var(--border); border-bottom: none; background: var(--chip-bg); font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ticker { font-weight: 600; }
  .gain-pos { color: var(--pos); font-weight: 600; }
  .gain-neg { color: var(--neg); font-weight: 600; }

  .re-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  .re-card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--shadow-2);
  }
  .re-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .re-card .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .tag.ppor { background: var(--accent-soft); color: var(--accent); }
  .tag.inv { background: var(--warn-soft); color: var(--warn-text); }
  .re-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; color: var(--text-secondary); border-top: 1px solid var(--border-soft); }
  .re-row:first-of-type { border-top: none; padding-top: 0; }
  .re-row .v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .re-range { font-size: 11px; color: var(--text-tertiary); margin: 4px 0 12px; }
  .re-equity { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
  .re-equity .lbl { font-size: 12px; color: var(--text-tertiary); }
  .re-equity .val { font-size: 19px; font-weight: 700; }
  .re-source { font-size: 10px; color: var(--text-tertiary); margin-top: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 22px 24px 8px; }

    background: var(--chip-bg);
    border-radius: 12px;
    padding: 10px 16px;

  .goal-block { padding: 6px 24px 22px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .goal-block b { color: var(--text); }

  .advice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 900px) { .advice-grid { grid-template-columns: 1fr; } }
  .advice-card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--shadow-2);
  }

    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-bottom: 12px;

  .advice-card .body { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
  .sev-high .icon { background: var(--neg-soft); }
  .sev-med .icon { background: var(--warn-soft); }
  .sev-good .icon { background: var(--pos-soft); }
  .sev-info .icon { background: var(--accent-soft); }
  .section-note { font-size: 11px; color: var(--footnote); margin: 12px 2px 0; }

  .goal-card { background: var(--card); border-radius: 18px; padding: 24px 26px; box-shadow: var(--shadow-2); }
  .goal-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .goal-card .row .t { font-size: 15px; font-weight: 600; }
  .goal-card .row .p { font-size: 22px; font-weight: 700; color: var(--accent); }
  .progress-track { height: 10px; border-radius: 100px; background: var(--ring-track); overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--accent), #64b5ff); transition: width 0.4s ease; }
  .goal-meta { display: flex; flex-wrap: wrap; gap: 18px; font-size: 12px; color: var(--text-secondary); }
  .goal-meta b { color: var(--text); font-weight: 600; }

  .risk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 900px) { .risk-grid { grid-template-columns: 1fr; } }
  .risk-card { background: var(--card); border-radius: 18px; padding: 20px 22px; box-shadow: var(--shadow-2); }
  .risk-card .label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
  .risk-card .value { font-size: 24px; font-weight: 700; }
  .risk-card .badge {
    display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 100px;
  }
  .risk-card .sub { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; }
  .badge.risk-hi { background: var(--neg-soft); color: var(--neg); }
  .badge.risk-mid { background: var(--warn-soft); color: var(--warn-text); }
  .badge.risk-lo { background: var(--pos-soft); color: var(--pos); }

  .chart-card { background: var(--card); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow-2); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .chart-head .label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
  .chart-actions { display: flex; gap: 12px; }
  .mini-btn { background: none; border: none; color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-empty { text-align: center; color: var(--text-tertiary); font-size: 12px; padding: 70px 0; }

  .setup-card { padding: 28px 30px; max-width: 640px; margin: 40px auto; }
  .setup-card h2 { margin: 0 0 10px; font-size: 19px; letter-spacing: -0.01em; }
  .setup-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .setup-card code { background: var(--chip-bg); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  .setup-card input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    margin: 8px 0 14px;
  }
  .setup-actions { display: flex; gap: 10px; }
  .setup-note { background: var(--warn-soft); color: var(--warn-text); border-radius: 10px; padding: 9px 14px; font-size: 12px; margin-bottom: 12px; }
  .setup-hint { font-size: 11px !important; color: var(--text-tertiary) !important; margin-top: 16px; }

  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--footnote);
    margin-top: 24px;
  }
  .loading { text-align: center; padding: 80px 0; color: var(--text-tertiary); font-size: 14px; }
  .errbox { background: var(--card); border-radius: 18px; padding: 24px; color: var(--neg); font-size: 13px; line-height: 1.6; }
  .errbox b { color: var(--text); }
  .errbox code { background: var(--chip-bg); padding: 2px 6px; border-radius: 6px; font-size: 12px; }

  @media (max-width: 640px) {
    body { padding: 20px 14px 48px; }
    .top h1 { font-size: 22px; }
    .hero { padding: 26px 22px; gap: 24px; }
    .hero-left .value { font-size: 34px; }
    .grid4 { grid-template-columns: 1fr 1fr; gap: 12px; }
    thead th, tbody td { padding-left: 14px; padding-right: 14px; }
    .setup-card { margin: 16px auto; }
  }
</style>

<script>
"use strict";

/* ================= Data source config =================
   The sheet URL is stored ONLY in this browser (localStorage),
   never in the repository. Accepts either:
   - a Google Sheets tab URL (link-sharing must be on), or
   - an Apps Script proxy URL (keeps the sheet private — see README). */
const CFG_KEY = "pad-config";
const CACHE_KEY = "pad-cache";
const HIST_KEY = "pad-history";
const REFRESH_MS = 5 * 60 * 1000;

function getConfig(){
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch(e) { return null; }
}
function saveConfig(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }

function csvUrlFromInput(input){
  input = (input || "").trim();
  const m = input.match(/docs\.google\.com\/spreadsheets\/d\/([A-Za-z0-9_-]+)/);
  if (m) {
    const gid = (input.match(/[#?&]gid=(\d+)/) || [])[1] || "0";
    // headers=0 so Google does not infer the title row as headers and blank string columns such as Ticker
    return "https://docs.google.com/spreadsheets/d/" + m[1] + "/gviz/tq?tqx=out:csv&headers=0&gid=" + gid;
  }
  if (/^https:\/\//i.test(input)) return input; // Apps Script proxy or any raw CSV endpoint
  if (/^[A-Za-z0-9_-]{25,}$/.test(input)) {
    return "https://docs.google.com/spreadsheets/d/" + input + "/gviz/tq?tqx=out:csv&headers=0&gid=0";
  }
  return null;
}

/* ================= Utilities ================= */
function clean(s){ return (s || "").replace(/\\/g, "").trim(); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function parseCurrency(s){
  s = clean(String(s == null ? "" : s));
  if (!s || s === "-" || s === "–") return 0;
  const neg = /^\(.*\)$/.test(s);
  s = s.replace(/[()$,₹]/g, "");
  const n = parseFloat(s.replace(/[^0-9.\-]/g, "")) || 0;
  return neg ? -Math.abs(n) : n;
}
function parsePercent(s){
  s = clean(String(s == null ? "" : s)).replace("%", "").replace(/,/g, "");
  return parseFloat(s) || 0;
}
function fmtCurrency(n){
  const neg = n < 0;
  const v = Math.abs(Math.round(n)).toLocaleString("en-AU");
  return (neg ? "-$" : "$") + v;
}
function fmtSigned(n){ return (n >= 0 ? "+" : "") + fmtCurrency(n); }
function fmtPrice(raw){
  const n = parseCurrency(raw);
  if (!n) return esc(clean(String(raw || ""))) || "—";
  return "$" + n.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(n, digits){ return (isFinite(n) ? n : 0).toFixed(digits == null ? 1 : digits) + "%"; }
function fmtInrCr(inr){ return "₹" + (inr / 1e7).toFixed(2) + " Cr"; }
function localDateStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Minimal RFC4180 CSV parser (handles quoted fields, embedded commas/quotes/newlines)
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.map(r => r.map(c => clean(c)));
}

/* ================= Sheet classification =================
   Rows are detected by shape, not by hardcoded names, so adding an owner,
   holding or property in the sheet just works. If a header row exists
   ("Ticker" for holdings, "Net Equity" for properties), columns are mapped
   by name; otherwise the original positional layout is assumed. */
const TICKER_RE = /^[A-Z0-9]{2,6}(\.[A-Z]{1,3})?$/;
const DEFAULT_H = { owner: 0, ticker: 1, shares: 3, price: 5, mv: 6, cb: 7, gainPct: 9, sector: -1 };
const DEFAULT_P = { name: 0, low: 3, value: 4, high: 5, loan: 6, offset: 7, netDebt: 8, equity: 9, updated: 10, source: 11 };

function findIn(low, names){
  for (const n of names){ const i = low.findIndex(c => c === n); if (i >= 0) return i; }
  for (const n of names){ const i = low.findIndex(c => c.includes(n)); if (i >= 0) return i; }
  return -1;
}
function findColumnMaps(rows){
  const H = Object.assign({}, DEFAULT_H), P = Object.assign({}, DEFAULT_P);
  for (const r of rows){
    const low = r.map(c => (c || "").toLowerCase());
    if (low.some(c => c === "ticker")){
      const set = (key, names) => { const i = findIn(low, names); if (i >= 0) H[key] = i; };
      set("ticker", ["ticker"]);
      set("shares", ["shares", "units", "qty", "quantity"]);
      set("price", ["price"]);
      set("mv", ["market value", "mkt value", "current value"]);
      set("cb", ["cost basis", "cost base", "total cost"]);
      set("gainPct", ["gain %", "gain%", "gain / loss %", "gain/loss %", "return %"]);
      const si = findIn(low, ["sector"]); if (si >= 0) H.sector = si;
      break;
    }
  }
  for (const r of rows){
    const low = r.map(c => (c || "").toLowerCase());
    if (low.some(c => c.includes("net equity"))){
      const set = (key, names) => { const i = findIn(low, names); if (i >= 0) P[key] = i; };
      set("low", ["cma low", "low"]);
      set("value", ["est. value", "est value", "mid"]);
      set("high", ["cma high", "high"]);
      set("loan", ["loan"]);
      set("offset", ["offset"]);
      set("netDebt", ["net debt"]);
      set("equity", ["net equity"]);
      set("updated", ["updated"]);
      set("source", ["source"]);
      break;
    }
  }
  return { H, P };
}

function classifyAll(rows){
  const { H, P } = findColumnMaps(rows);
  const holdingsByOwner = {};
  const owners = [];
  const properties = [];
  const map = {};
  const holdingsTotal = { mv: 0, cb: 0 };
  const re = { value: 0, loan: 0, offset: 0, equity: 0 };
  let lastOwner = "";

  rows.forEach(r => {
    const low0 = (r[0] || "").toLowerCase();
    const isHeader = r.some(c => (c || "").toLowerCase() === "ticker") ||
                     r.some(c => (c || "").toLowerCase().includes("net equity"));
    if (isHeader) return;

    // Holdings row: ticker-shaped symbol with positive shares and market value
    const tick = r[H.ticker] || "";
    const mv = parseCurrency(r[H.mv]);
    const sh = parseCurrency(r[H.shares]);
    if (TICKER_RE.test(tick) && mv > 0 && sh > 0){
      const owner = r[H.owner] || lastOwner;
      if (!owner) return;
      lastOwner = owner;
      if (!holdingsByOwner[owner]){ holdingsByOwner[owner] = []; owners.push(owner); }
      const item = {
        owner, ticker: tick, shares: r[H.shares], sharesNum: sh, price: r[H.price],
        mv, cb: parseCurrency(r[H.cb]), gainPct: parsePercent(r[H.gainPct]),
        sheetSector: H.sector >= 0 ? (r[H.sector] || "") : ""
      };
      holdingsByOwner[owner].push(item);
      holdingsTotal.mv += item.mv;
      holdingsTotal.cb += item.cb;
      return;
    }

    // Property row: has a name plus CMA low/mid/high and non-zero net equity
    const name = r[P.name] || "";
    if (name && !/^(total|combined|grand)/i.test(name)){
      const val = parseCurrency(r[P.value]);
      const lowV = parseCurrency(r[P.low]);
      const highV = parseCurrency(r[P.high]);
      const eq = parseCurrency(r[P.equity]);
      if (val > 50000 && lowV > 0 && highV >= val && eq !== 0){
        const p = {
          name, low: lowV, value: val, high: highV,
          loan: parseCurrency(r[P.loan]), offset: parseCurrency(r[P.offset]),
          netDebt: parseCurrency(r[P.netDebt]), equity: eq,
          updated: r[P.updated] || "", source: r[P.source] || ""
        };
        properties.push(p);
        re.value += p.value; re.loan += p.loan; re.offset += p.offset; re.equity += p.equity;
        return;
      }
    }

    // Everything else with a label + value is profile/summary data
    if (r[0] && r[1] !== undefined && r[1] !== "" && low0 !== "owner") map[r[0]] = r[1];
  });

  return { holdingsByOwner, owners, properties, map, holdingsTotal, re };
}

/* ================= Load & cache ================= */
let loading = false;
let lastLoadAt = 0;

function cacheCsv(text){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ text, at: Date.now() })); } catch(e) {}
}
function getCache(){
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch(e) { return null; }
}

async function load(){
  if (loading) return;
  const cfg = getConfig();
  if (!cfg || !cfg.csvUrl){ renderSetup(); return; }
  loading = true;
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true; btn.textContent = "⟳ Refreshing…";
  document.getElementById("updatedAt").textContent = "Refreshing…";
  try {
    const res = await fetch(cfg.csvUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/^\s*<|accounts\.google\.com|Sign in/i.test(text)) throw new Error("SHARING");
    const data = classifyAll(parseCSV(text));
    if (!data.owners.length) throw new Error("The sheet loaded, but no holdings rows with ticker + market value were found.");
    cacheCsv(text);
    lastLoadAt = Date.now();
    render(data);
    document.getElementById("updatedAt").textContent =
      "Live · updated " + new Date().toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" });
  } catch (e) {
    handleLoadError(e);
  } finally {
    loading = false;
    btn.disabled = false; btn.textContent = "⟳ Refresh";
  }
}

function handleLoadError(e){
  const sharing = e && e.message === "SHARING";
  const reason = sharing ? "the data source needs link-sharing (or the URL changed)" : (e && e.message ? e.message : "unknown error");

  // Keep showing the last good data instead of wiping the dashboard
  const cache = getCache();
  if (cache && cache.text){
    try {
      const data = classifyAll(parseCSV(cache.text));
      if (data.owners.length){
        render(data, { stale: { at: cache.at, reason } });
        document.getElementById("updatedAt").textContent = "Showing cached data";
        return;
      }
    } catch(_) {}
  }

  document.getElementById("app").innerHTML =
    '<div class="errbox"><b>Could not load live data.</b><br><br>' +
    (sharing
      ? 'This usually means the Sheet\'s link-sharing isn\'t turned on yet. In the Sheet, click <b>Share</b> → under "General access" choose <b>Anyone with the link</b> → <b>Viewer</b> → Done. Then hit Refresh here. (Or use the Apps Script proxy from the README to keep the sheet private.)'
      : 'Details: ' + esc(reason) + '. Check your internet connection and try Refresh.') +
    '<br><br><button class="refresh-btn" id="errSettings">Change data source</button></div>';
  document.getElementById("updatedAt").textContent = "Load failed";
  const b = document.getElementById("errSettings");
  if (b) b.addEventListener("click", () => renderSetup());
}

/* ================= Setup screen ================= */
function renderSetup(notice){
  const cfg = getConfig();
  document.getElementById("updatedAt").textContent = "Not connected";
  document.getElementById("app").innerHTML = `
  <div class="card setup-card">
    <h2>Connect your data source</h2>
    ${notice ? `<div class="setup-note">${esc(notice)}</div>` : ""}
    <p>Paste the URL of your Google Sheet tab — copy it from the browser address bar so it includes <code>gid=…</code> — or the URL of your Apps Script proxy if you've set one up (recommended; keeps the sheet private — see the README).</p>
    <input id="srcInput" type="url" spellcheck="false" placeholder="https://docs.google.com/spreadsheets/d/…/edit#gid=0" value="${esc(cfg && cfg.input || "")}">
    <div class="setup-actions">
      <button class="refresh-btn" id="srcSave">Save &amp; load</button>
      ${cfg && cfg.csvUrl ? '<button class="refresh-btn" id="srcCancel">Cancel</button>' : ""}
    </div>
    <p class="setup-hint">The URL is stored only in this browser (localStorage) — it is never committed to the repository or sent anywhere except Google. Direct sheet URLs require link-sharing (Share → Anyone with the link → Viewer); the Apps Script proxy does not.</p>
  </div>`;
  document.getElementById("srcSave").addEventListener("click", () => {
    const input = document.getElementById("srcInput").value;
    const url = csvUrlFromInput(input);
    if (!url){ renderSetup("That doesn't look like a Google Sheets URL, sheet ID, or https endpoint — please check and try again."); return; }
    saveConfig({ input: input.trim(), csvUrl: url });
    load();
  });
  const c = document.getElementById("srcCancel");
  if (c) c.addEventListener("click", load);
}

      html += `
      <div class="advice-card sev-${r.sev}">
        <div class="icon">${r.emoji}</div>
        <div class="title">${r.title}</div>
        <div class="body">${r.body}</div>
      </div>`;
    });
    html += `</div><div class="section-note">Signals are generated live from the sheet data by fixed threshold rules (position &gt;15%, sector &gt;25%, loss &lt;−30%, etc.) — informational only, not financial advice.</div></div>`;
  }

  html += `<div class="footnote">Stock & ETF prices refresh live from Google Sheets (GOOGLEFINANCE) via CSV — auto-refreshes every 5 minutes while the tab is visible. Property values, loan balances and profile figures are updated manually in the sheet. Data source is configured per-browser (⚙).</div>`;

  document.getElementById("app").innerHTML = html;

  // Post-render wiring
  if (history.length > 1) drawHistoryChart(history);
  const ex = document.getElementById("histExport");
  if (ex) ex.addEventListener("click", exportHistory);
  const im = document.getElementById("histImport");
  const fileInput = document.getElementById("histFile");
  if (im && fileInput){
    im.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => importHistory(e.target.files[0]));
  }
}

/* ================= Net worth history =================
   One snapshot per local calendar day, stored in localStorage.
   Export/Import lets you move history between browsers/devices. */
function getHistory(){
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch(e) { return []; }
}
function logSnapshot(netWorth, eqMv, reEquity){
  let hist = getHistory();
  const today = localDateStr();
  const entry = { date: today, netWorth, eq: eqMv, re: reEquity };
  const idx = hist.findIndex(h => h.date === today);
  if (idx >= 0) hist[idx] = entry; else hist.push(entry);
  hist.sort((a, b) => a.date.localeCompare(b.date));
  if (hist.length > 730) hist = hist.slice(hist.length - 730);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch(e) {}
  return hist;
}
function exportHistory(){
  const blob = new Blob([JSON.stringify(getHistory(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "networth-history-" + localDateStr() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importHistory(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) throw new Error("not an array");
      const byDate = {};
      imported.forEach(h => { if (h && h.date && typeof h.netWorth === "number") byDate[h.date] = h; });
      getHistory().forEach(h => { byDate[h.date] = h; }); // existing entries win on conflicts
      let merged = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
      if (merged.length > 730) merged = merged.slice(merged.length - 730);
      localStorage.setItem(HIST_KEY, JSON.stringify(merged));
      lastHistory = merged;
      load();
    } catch(e) {
      alert("Could not import that file — expected a JSON export from this dashboard.");
    }
  };
  reader.readAsText(file);
}

let historyChartInstance = null;
let lastHistory = null;
function drawHistoryChart(history){
  lastHistory = history;
  const canvas = document.getElementById("historyChart");
  if (!canvas || typeof Chart === "undefined") return;
  if (historyChartInstance) { historyChartInstance.destroy(); historyChartInstance = null; }
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue("--accent").trim() || "#0071e3";
  const pos = styles.getPropertyValue("--pos").trim() || "#1a9d4b";
  const gridColor = styles.getPropertyValue("--border-soft").trim() || "#f2f2f4";
  const textColor = styles.getPropertyValue("--text-tertiary").trim() || "#86868b";
  // Older snapshots stored eqPct instead of eq — derive so the equities line spans them too
  const eqSeries = history.map(h => h.eq != null ? h.eq : (h.eqPct != null ? h.netWorth * h.eqPct / 100 : null));
  historyChartInstance = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels: history.map(h => h.date),
      datasets: [{
        label: "Net Worth",
        data: history.map(h => h.netWorth),
        borderColor: accent,
        backgroundColor: accent + "22",
        fill: true,
        tension: 0.35,
        pointRadius: 0,
        borderWidth: 2.5
      }, {
        label: "Equities",
        data: eqSeries,
        borderColor: pos,
        fill: false,
        tension: 0.35,
        pointRadius: 0,
        borderWidth: 1.5,
        borderDash: [5, 4],
        spanGaps: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: textColor, boxWidth: 10, boxHeight: 2, font: { size: 10 } } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ": " + fmtCurrency(ctx.parsed.y) } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: textColor, font: { size: 10 }, maxTicksLimit: 6 } },
        y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 },
              callback: (v) => "$" + (v / 1000).toFixed(0) + "k" } }
      }
    }
  });
}

/* ================= FIRE timeline projection =================
   The target itself grows every year (income need + home cost inflate in INR),
   while the portfolio grows via assumed returns + ongoing savings. Find the
   first year the (FX-converted) inflated target is met. */
function projectYearsToFire(currentNetWorth, map, fxRate){
  const monthlyIncomeToday = parseCurrency(map["Desired Monthly Passive Income Today (INR)"]);
  const homeCostToday = parseCurrency(map["Target India Home Cost Today (INR)"]);
  const swr = parsePercent(map["Safe Withdrawal Rate"]) / 100;
  const inflation = parsePercent(map["Assumed India Inflation Rate"]) / 100;
  const growthRate = parsePercent(map["Assumed Annual Portfolio Growth Rate"]) / 100;
  const annualSavings = parseCurrency(map["Annual Savings Rate"]);
  if (!fxRate || !swr || (monthlyIncomeToday === 0 && homeCostToday === 0)) return null;

  const annualIncomeToday = monthlyIncomeToday * 12;
  const corpusTodayInr = (annualIncomeToday / swr) + homeCostToday;
  const corpusTodayAud = corpusTodayInr / fxRate;
  if (currentNetWorth >= corpusTodayAud) return { years: 0, futureCorpusAUD: corpusTodayAud };

  let balance = currentNetWorth;
  for (let year = 1; year <= 60; year++) {
    balance = balance * (1 + growthRate) + annualSavings;
    const inflatedIncome = annualIncomeToday * Math.pow(1 + inflation, year);
    const inflatedHome = homeCostToday * Math.pow(1 + inflation, year);
    const targetInrYear = (inflatedIncome / swr) + inflatedHome;
    const targetAudYear = targetInrYear / fxRate; // FX rate held constant as a simplifying assumption
    if (balance >= targetAudYear) return { years: year, futureCorpusAUD: targetAudYear };
  }
  return { years: "60+", futureCorpusAUD: null };
}

/* ================= Concentration analytics =================
   All figures aggregate the same ticker across owners first, so a stock
   both partners hold is measured as one position. */
function computeConcentrationRisk(allHoldings, totalMv){
  const byTicker = {};
  allHoldings.forEach(h => {
    if (!byTicker[h.ticker]) byTicker[h.ticker] = { ticker: h.ticker, mv: 0, cb: 0, shares: 0, owners: [], sector: sectorOf(h) };
    const t = byTicker[h.ticker];
    t.mv += h.mv; t.cb += h.cb; t.shares += h.sharesNum || 0;
    if (!t.owners.includes(h.owner)) t.owners.push(h.owner);
  });

  let topTicker = "—", topMv = 0, hhi = 0;
  const sectorMv = {};
  Object.values(byTicker).forEach(t => {
    if (t.mv > topMv) { topMv = t.mv; topTicker = t.ticker; }
    const weight = totalMv ? t.mv / totalMv : 0;
    hhi += weight * weight * 10000;
    sectorMv[t.sector] = (sectorMv[t.sector] || 0) + t.mv;
  });
  const topPct = totalMv ? (topMv / totalMv) * 100 : 0;

  let topSector = "—", topSectorMv = 0;
  Object.entries(sectorMv).forEach(([name, mv]) => {
    if (name !== DIVERSIFIED && mv > topSectorMv) { topSectorMv = mv; topSector = name; }
  });
  const topSectorPct = totalMv ? (topSectorMv / totalMv) * 100 : 0;

  return {
    byTicker, sectorMv, totalMv,
    topTicker, topPct,
    topBadge: topPct > 25 ? "risk-hi" : topPct > 12 ? "risk-mid" : "risk-lo",
    topLabel: topPct > 25 ? "Very concentrated" : topPct > 12 ? "Elevated" : "Reasonable",
    hhi: Math.round(hhi),
    hhiBadge: hhi > 2500 ? "risk-hi" : hhi > 1500 ? "risk-mid" : "risk-lo",
    hhiLabel: hhi > 2500 ? "Highly concentrated" : hhi > 1500 ? "Moderately concentrated" : "Well diversified",
    topSector, topSectorPct,
    topSectorBadge: topSectorPct > 40 ? "risk-hi" : topSectorPct > 20 ? "risk-mid" : "risk-lo",
    topSectorLabel: topSectorPct > 40 ? "Single-sector bet" : topSectorPct > 20 ? "Overweight" : "Balanced"
  };
}

// The single biggest individual asset — one ticker or one property, never an aggregate
function computeLargestAsset(byTicker, properties, netWorth){
  if (!netWorth) return { name: "—", pct: 0, badge: "risk-lo", label: "—" };
  const candidates = [
    ...Object.values(byTicker).map(t => ({ name: t.ticker, value: t.mv })),
    ...properties.map(p => ({ name: p.name, value: p.equity }))
  ];
  if (!candidates.length) return { name: "—", pct: 0, badge: "risk-lo", label: "—" };
  const top = candidates.reduce((a, b) => (b.value > a.value ? b : a));
  const pct = (top.value / netWorth) * 100;
  const badge = pct > 40 ? "risk-hi" : pct > 25 ? "risk-mid" : "risk-lo";
  const label = pct > 40 ? "Dominant asset" : pct > 25 ? "Concentrated" : "Balanced";
  return { name: top.name, pct, badge, label };
}

// One breakdown: equity sectors + each property's net equity, all sized against total net worth
function computeNetWorthBreakdown(sectorMv, properties, netWorth){
  if (!netWorth) return [];
  const rows = Object.entries(sectorMv).map(([name, mv]) => ({
    name, group: "Equities", pct: (mv / netWorth) * 100, color: SECTOR_COLORS[name] || SECTOR_COLORS.Other
  }));
  properties.forEach((p, i) => {
    rows.push({ name: p.name, group: "Real Estate", pct: (p.equity / netWorth) * 100, color: PROPERTY_COLORS[i % PROPERTY_COLORS.length] });
  });
  return rows.sort((a, b) => b.pct - a.pct);
}

/* ================= Rule-based signals =================
   Every card below is generated from thresholds applied to live data.
   Nothing is hardcoded to a specific ticker, owner or dollar figure. */
function buildRecommendations({ risk, holdingsTotal, re, map, fxRate, fireCorpusTodayAUD }){
  const recs = [];
  const T = holdingsTotal.mv;
  const tickers = Object.values(risk.byTicker);

  // 1. Oversized single-stock positions (diversified ETFs exempt), worst two
  if (T > 0){
    tickers
      .filter(t => t.sector !== DIVERSIFIED && (t.mv / T) * 100 > 15)
      .sort((a, b) => b.mv - a.mv)
      .slice(0, 2)
      .forEach(t => {
        const pct = (t.mv / T) * 100;
        const sellAmount = t.mv - 0.15 * T;
        const sellShares = t.shares > 0 ? Math.round(sellAmount / (t.mv / t.shares)) : 0;
        const gainPct = t.cb ? ((t.mv - t.cb) / t.cb) * 100 : 0;
        const cgtNote = gainPct < 0
          ? `It's under water (${fmtPct(gainPct)}), so selling realises a capital loss you can offset against other gains.`
          : gainPct < 10
            ? `The unrealised gain is small (${fmtPct(gainPct)}), so the CGT cost of acting now is minimal.`
            : `It's sitting on a +${fmtPct(gainPct)} gain — spread sales across financial years and use the 12-month CGT discount where parcels qualify.`;
        recs.push({
          sev: "high", emoji: "🎯",
          title: `Trim ${esc(t.ticker)} — it's ${fmtPct(pct, 0)} of your entire share portfolio`,
          body: `${fmtCurrency(t.mv)} in a single company is well past a prudent single-stock cap. ${cgtNote} Selling roughly ${fmtCurrency(sellAmount)}${sellShares ? ` (≈${sellShares.toLocaleString("en-AU")} shares at current prices)` : ""} in 2–3 tranches brings it down to ~15% of the book, with proceeds into the diversified ETFs you already hold.`
        });
      });
  }

  // 2. Sector concentration (largest non-diversified sector > 25% of equities)
  if (T > 0 && risk.topSectorPct > 25){
    const sectorTickers = tickers.filter(t => t.sector === risk.topSector).map(t => t.ticker).join(", ");
    const sectorMv = risk.sectorMv[risk.topSector] || 0;
    const trimAmount = Math.max(sectorMv - 0.20 * T, 0);
    recs.push({
      sev: "high", emoji: "⚖️",
      title: `${esc(risk.topSector)} is ${fmtPct(risk.topSectorPct, 0)} of your shares — one macro driver, one outcome`,
      body: `${esc(sectorTickers)} total ${fmtCurrency(sectorMv)} and are driven by the same cycle, so this isn't ${tickers.filter(t => t.sector === risk.topSector).length} separate bets — it's one. Trimming ${fmtCurrency(trimAmount)} across the basket gets the sector to ~20% of the share portfolio. Set a standing rule: no single sector above 20% of equities, rebalanced every 6 months.`
    });
  }

  // 3. Unusually large losses — verify the cost base, then consider harvesting
  tickers
    .filter(t => t.cb > 0 && ((t.mv - t.cb) / t.cb) * 100 < -30)
    .sort((a, b) => (a.mv - a.cb) / a.cb - (b.mv - b.cb) / b.cb)
    .slice(0, 2)
    .forEach(t => {
      const lossPct = ((t.mv - t.cb) / t.cb) * 100;
      recs.push({
        sev: "med", emoji: "🔍",
        title: `${esc(t.ticker)} shows a ${fmtPct(Math.abs(lossPct), 0)} loss — verify before acting`,
        body: `Cost ${fmtCurrency(t.cb)} vs current ${fmtCurrency(t.mv)}. First check your broker statement for a corporate action (capital return, demerger, consolidation) that may have distorted the recorded cost base. If the loss is genuine, it's a tax-loss harvesting candidate: realise it against this year's capital gains, then either stay out for 30+ days or switch to a sector ETF to keep the exposure without a wash-sale-style ATO challenge.`
      });
    });

  // 4. Same ticker held by multiple owners — admin overhead, not diversification
  const dupes = tickers.filter(t => t.owners.length > 1);
  if (dupes.length){
    recs.push({
      sev: "info", emoji: "🗂️",
      title: `${dupes.map(t => esc(t.ticker)).join(", ")} held in both portfolios — consolidate the tracking`,
      body: `${dupes.map(t => `${esc(t.ticker)} (${fmtCurrency(t.mv)} across ${t.owners.map(esc).join(" + ")})`).join("; ")}. Not a diversification problem, but it doubles the admin — two DRPs and two tax statements per holding for the same exposure. Going forward, top up each ETF from whichever account already holds the larger position so CGT records stay in one place.`
    });
  }

  // 5. Put monthly surplus on autopilot
  const monthly = parseCurrency(map["Monthly Savings Rate"]);
  const hasIndiaGoal = parseCurrency(map["Target India Home Cost Today (INR)"]) > 0 || parseCurrency(map["Desired Monthly Passive Income Today (INR)"]) > 0;
  if (monthly > 0){
    const toEquities = Math.round(monthly * 0.7 / 100) * 100;
    const toOther = monthly - toEquities;
    recs.push({
      sev: "info", emoji: "💵",
      title: `Put the ${fmtCurrency(monthly)}/month surplus on autopilot`,
      body: `Set up two standing transfers on payday: ${fmtCurrency(toEquities)}/month (70%) into your diversified ETFs${T > 0 && risk.topPct > 15 ? " until the oversized positions above are back under their caps" : ""}, and ${fmtCurrency(toOther)}/month (30%) ${hasIndiaGoal ? "earmarked for the relocation fund (next card)" : re.loan > 0 ? "into the offset against your highest-rate loan" : "into a cash buffer"}. Automating this removes the temptation to let surplus cash drift.`
    });
  }

  // 6. Currency mismatch vs the India goal
  if (hasIndiaGoal && monthly > 0){
    const fxAmount = Math.round(monthly * 0.3 / 100) * 100;
    recs.push({
      sev: "info", emoji: "🌏",
      title: "Start building the India fund now, not at move time",
      body: `Your assets are AUD-denominated while the goal${fireCorpusTodayAUD ? ` (${fmtCurrency(fireCorpusTodayAUD)} target corpus)` : ""} is INR-denominated — converting one lump sum at relocation is a currency-timing bet you don't need to take. Direct the ${fmtCurrency(fxAmount)}/month earmarked above into an ASX-listed India ETF (e.g. NDIA) or recurring AUD→INR transfers into an NRE deposit/mutual fund. Review the rate${fxRate ? ` (currently ${fxRate.toFixed(2)})` : ""} quarterly and accelerate when it's favourable.`
    });
  }

  // 7. All clear
  if (!recs.some(r => r.sev === "high" || r.sev === "med")){
    recs.unshift({
      sev: "good", emoji: "✅",
      title: "No concentration flags right now",
      body: `Largest single position ${esc(risk.topTicker)} at ${fmtPct(risk.topPct, 0)} of equities and top sector ${esc(risk.topSector)} at ${fmtPct(risk.topSectorPct, 0)} are both inside the 15% / 25% lines. Keep rebalancing against those thresholds every 6 months.`
    });
  }

  const order = { high: 0, med: 1, info: 2, good: 3 };
  return recs.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ================= Theme & boot ================= */
function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  localStorage.setItem("pad-theme", mode);
  document.querySelectorAll(".theme-toggle .opt").forEach(el => {
    el.classList.toggle("active", el.dataset.mode === mode);
  });
  // Redraw the chart so gridlines/labels pick up the new theme immediately
  if (historyChartInstance && lastHistory) drawHistoryChart(lastHistory);
}

document.addEventListener("DOMContentLoaded", () => {
  setTheme(localStorage.getItem("pad-theme") || "light");
  document.getElementById("themeToggle").addEventListener("click", (e) => {
    const opt = e.target.closest(".opt");
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    setTheme(opt ? opt.dataset.mode : (cur === "light" ? "dark" : "light"));
  });
  document.getElementById("refreshBtn").addEventListener("click", load);
  document.getElementById("settingsBtn").addEventListener("click", () => renderSetup());
  load();
  // Auto-refresh every 5 minutes, but only while the tab is visible
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastLoadAt > REFRESH_MS) load();
  });
});
